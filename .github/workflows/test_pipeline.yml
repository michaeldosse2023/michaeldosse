name: Python Code & Schema CI

# 1. Trigger this workflow on every code push to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # 2. Spin up a clean, temporary Linux virtual machine

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated ETL tests
      run: |
        python -m pytest test_etl.py